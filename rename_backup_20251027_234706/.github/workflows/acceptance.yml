name: Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: development
      RUN_UI_SMOKE: '1'
      TEST_BASE_URL: http://127.0.0.1:5001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare acceptance env
        run: |
          cat <<EOF > .env
          FLASK_ENV=development
          PORT=5001
          SECRET_KEY=ci-default-secret
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_PUBLISHABLE_KEY=pk_test_dummy
          STRIPE_PRICE_ID=price_test_dummy
          STRIPE_TEST_PRICE_ID=price_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_test_dummy
          ADMIN_EMAILS=admin@example.com
          ALLOW_DEV_DEBUG=1
          TEST_DB_PATH=${RUNNER_TEMP}/togetherly-acceptance.db
          EOF

      - name: Run acceptance API and UI smoke tests
        env:
          RUN_UI_SMOKE: '1'
          TEST_BASE_URL: http://127.0.0.1:5001
        run: |
          set -eo pipefail
          set -a
          . ./.env
          set +a
          python app.py > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for i in {1..40}; do
            if curl -s "http://127.0.0.1:${PORT}/__dev__/ping" | grep -q pong; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Server failed to become ready" >&2
            tail -n 200 /tmp/server.log || true
            kill "$SERVER_PID" || true
            wait "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          pytest -q tests/test_ui_smoke.py tests/test_acceptance_api.py --maxfail=1 --junitxml=pytest-report.xml 2>&1 | tee pytest.log
          STATUS=$?
          kill "$SERVER_PID" || true
          wait "$SERVER_PID" 2>/dev/null || true
          if [ "$STATUS" -ne 0 ]; then
            echo "--- server.log (tail) ---"
            tail -n 200 /tmp/server.log || true
          fi
          exit "$STATUS"

      - name: Run integration acceptance suite
        run: |
          set -eo pipefail
          set -a
          . ./.env
          set +a
          export TEST_DB_PATH="${RUNNER_TEMP}/acceptance-suite.db"
          pytest -q tests/test_end_to_end.py tests/test_generate_gate.py tests/test_generate_gating.py tests/test_signup_subscribe.py tests/test_cancel_subscription.py

      - name: Run e2e smoke script via pytest
        env:
          RUN_UI_SMOKE: '1'
        run: |
          chmod +x scripts/e2e_run.sh
          pytest -q tests/test_e2e_runner.py --maxfail=1 --junitxml=pytest-e2e-report.xml 2>&1 | tee pytest-e2e.log

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-artifacts
          path: |
              /tmp/server.log
              tmp/
              pytest.log
              pytest-report.xml
              pytest-e2e.log
              pytest-e2e-report.xml
          if-no-files-found: ignore
