<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #eef2ff 0%, #ffffff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: radial-gradient(100% 100% at 30% 20%, #a5b4fc 0%, #6366F1 60%, #1d4ed8 100%);
      border-radius: 20px;
      margin: 0 auto 30px;
      box-shadow: 0 8px 32px rgba(99,102,241,.4);
    }
    h1 {
      font-size: 72px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 20px;
    }
    .brand {
      color: #6366F1;
    }
    p {
      font-size: 36px;
      color: #64748b;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"></div>
  <h1>Swelly</h1>
  <p>Simple, smart social media<br><span class="brand">that sounds like you</span></p>
  </div>
</body>
</html>
