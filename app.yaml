runtime: python3
instance_class: F1
automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 3

handlers:
- url: /static
  static_dir: static
  secure: always

- url: /.*
  script: auto
  secure: always

env_variables:
  SECRET_KEY: "your-secret-key-here"
  FLASK_ENV: "production"
  PORT: "8080"

# Optional: Add these if you have the keys
# STRIPE_SECRET_KEY: "sk_test_..."
# STRIPE_PUBLISHABLE_KEY: "pk_test_..."
# OPENAI_API_KEY: "sk-..."
# ADMIN_EMAILS: "your@email.com"