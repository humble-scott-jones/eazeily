name: Apply migrations to staging (manual)

on:
  workflow_dispatch: {}

jobs:
  apply_migrations:
    name: Apply migrations to staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      # map secrets into env so check_env_vars.py can validate presence of keys
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      RAILWAY_POSTGRES_DATABASE_URL: '${{ secrets.RAILWAY_POSTGRES_DATABASE_URL }}'
      RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide migration mode
        id: decide
        run: |
          # Allow fallback to the shared Railway Postgres secret if STAGING_DATABASE_URL isn't set directly.
          if [ -z "${STAGING_DATABASE_URL:-}" ] && [ -n "${RAILWAY_POSTGRES_DATABASE_URL:-}" ]; then
            echo "Using Railway Postgres fallback connection URL"
            echo "STAGING_DATABASE_URL=${RAILWAY_POSTGRES_DATABASE_URL}" >> "$GITHUB_ENV"
            STAGING_DATABASE_URL="$RAILWAY_POSTGRES_DATABASE_URL"
          fi

          # If STAGING_DATABASE_URL (possibly via fallback) is provided we will apply migrations directly from Actions runner.
          # Otherwise we will attempt to run migrations inside Railway using the Railway CLI (railway run).
          if [ -n "${STAGING_DATABASE_URL:-}" ]; then
            echo "mode=direct" >> $GITHUB_OUTPUT
          elif [ -n "${RAILWAY_API_KEY:-}" ] && [ -n "${RAILWAY_PROJECT_ID:-}" ]; then
            echo "mode=railway_run" >> $GITHUB_OUTPUT
          else
            echo "No STAGING_DATABASE_URL and no Railway secrets available; cannot apply migrations." >&2
            exit 1
          fi

      - name: Validate required staging env vars (check_env_vars)
        run: |
          # Run the env file checker; fail if required keys are missing. For railway_run mode the Railway secrets must exist.
          python3 ./scripts/check_env_vars.py --file .env.staging.example

      - name: Generate migration SQL (for review)
        run: |
          alembic -c alembic.ini upgrade --sql head > migration.sql

      - name: Run safety check on generated SQL
        run: |
          ./scripts/migration_safety_check.sh alembic.ini || (echo "Safety check failed" && exit 1)

      - name: Apply migrations (direct DB)
        if: steps.decide.outputs.mode == 'direct'
        env:
          DATABASE_URL: ${{ env.STAGING_DATABASE_URL }}
        run: |
          echo "Applying migrations to staging database from Actions runner..."
          alembic -c alembic.ini upgrade head

      - name: Apply migrations (railway run)
        if: steps.decide.outputs.mode == 'railway_run'
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "Applying migrations inside Railway project using railway run..."
          chmod +x ./scripts/railway_run_migrations.sh
          ./scripts/railway_run_migrations.sh

      - name: Trigger Railway deploy (optional)
        if: env.RAILWAY_API_KEY != '' && env.RAILWAY_PROJECT_ID != ''
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "RAILWAY_API_KEY and RAILWAY_PROJECT_ID present — attempting to trigger a Railway deployment"
          chmod +x ./scripts/railway_deploy.sh
          ./scripts/railway_deploy.sh
