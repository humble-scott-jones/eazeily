name: CI

on:
  push:
    branches:
      - main
      - integration/2025-11-sync
  pull_request:
    branches:
      - main
      - integration/2025-11-sync

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gitleaks
        # The gitleaks GitHub Action has introduced stricter inputs and
        # licensing requirements which broke some PR runs. Replace the
        # action with a Docker-based invocation of the gitleaks container so
        # we can run a license-free scan across the checked-out repo.
        # Keep this step non-blocking while we validate the results.
        run: |
          echo "Running gitleaks via Docker (non-blocking)"
          docker run --rm -v "$GITHUB_WORKSPACE":/src zricethezav/gitleaks:8.2.0 detect --source /src --report-format json --report-path /src/gitleaks-report.json || true

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    env:
      FLASK_ENV: development
      RUN_E2E: '0'
      RUN_UI_SMOKE: '0'
      PORT: '5001'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright (optional)
        if: env.RUN_E2E == '1'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps

      - name: Diagnostics
        run: |
          echo "--- Environment ---"
          python --version
          pip --version
          pip list --disable-pip-version-check | sed -n '1,200p' || true
          echo "--- Env vars (non-sensitive) ---"
          echo "FLASK_ENV=${FLASK_ENV:-}" || true
          echo "RUN_E2E=${RUN_E2E:-}" || true
          echo "RUN_UI_SMOKE=${RUN_UI_SMOKE:-}" || true
          echo "TEST_DB_PATH=${TEST_DB_PATH:-}" || true

      - name: Run tests
        env:
              # Note: avoid setting TEST_DB_PATH for the main unit test run so
              # init_db() seeding (dev admin) runs as expected. Tests that need
              # an isolated DB should set TEST_DB_PATH in their specific job.
          HEADLESS: '1'
        run: |
          set -eo pipefail
              export SECRET_KEY="${SECRET_KEY:-ci-default-secret}"
          export STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY:-sk_test_dummy}"
          export STRIPE_PUBLISHABLE_KEY="${STRIPE_PUBLISHABLE_KEY:-pk_test_dummy}"
          export STRIPE_PRICE_ID="${STRIPE_PRICE_ID:-price_test_dummy}"
          export STRIPE_TEST_PRICE_ID="${STRIPE_TEST_PRICE_ID:-price_test_dummy}"
              # Do NOT enable webhook signature verification for unit tests by
              # leaving STRIPE_WEBHOOK_SECRET empty; this allows tests to post
              # plain JSON payloads without Stripe signatures.
              export STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET:-}"
          export ADMIN_EMAILS="${ADMIN_EMAILS:-admin@example.com}"

          python --version
          if [ -n "${SECRET_KEY:-}" ]; then echo "SECRET_KEY is set"; else echo "SECRET_KEY is empty"; fi
          # Run fast unit tests only: exclude e2e and slow tests. Produce junit + log for triage.
          pytest -q -m "not e2e and not slow" --maxfail=1 --junitxml=pytest-report.xml 2>&1 | tee pytest.log

      - name: Upload pytest artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-artifacts
          path: |
            pytest-report.xml
            pytest.log
          if-no-files-found: ignore

  triage-smoke:
    name: "Triage: quick smoke on failure"
    needs: tests
    if: ${{ needs.tests.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps for triage
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run smoke subset for quick triage
        run: |
          set -eo pipefail
          # run a focused smoke selection to reveal environment/setup issues quickly
          pytest -q -k smoke --maxfail=1 2>&1 | tee triage-smoke.log

      - name: Upload triage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-artifacts
          path: |
            triage-smoke.log
          if-no-files-found: ignore

  smoke:
    name: Acceptance Smoke
    needs: tests
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: development
      RUN_UI_SMOKE: '1'
      TEST_BASE_URL: http://127.0.0.1:5001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare acceptance env
        run: |
          cat <<EOF > .env
          FLASK_ENV=development
          PORT=5001
          SECRET_KEY=ci-default-secret
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_PUBLISHABLE_KEY=pk_test_dummy
          STRIPE_PRICE_ID=price_test_dummy
          STRIPE_TEST_PRICE_ID=price_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_test_dummy
          ADMIN_EMAILS=admin@example.com
          ALLOW_DEV_DEBUG=1
          TEST_DB_PATH=${RUNNER_TEMP}/togetherly-acceptance.db
          EOF

      - name: Run API smoke acceptance tests
        env:
          RUN_UI_SMOKE: '1'
          TEST_BASE_URL: http://127.0.0.1:5001
        run: |
          set -eo pipefail
          set -a
          . ./.env
          set +a
          python app.py > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for i in {1..40}; do
            if curl -s "http://127.0.0.1:${PORT}/__dev__/ping" | grep -q pong; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Server failed to become ready" >&2
            tail -n 200 /tmp/server.log || true
            kill "$SERVER_PID" || true
            wait "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          pytest -q tests/test_ui_smoke.py tests/test_acceptance_api.py --maxfail=1 --junitxml=pytest-report.xml 2>&1 | tee pytest.log
          STATUS=$?
          kill "$SERVER_PID" || true
          wait "$SERVER_PID" 2>/dev/null || true
          if [ "$STATUS" -ne 0 ]; then
            echo "--- server.log (tail) ---"
            tail -n 200 /tmp/server.log || true
          fi
          exit "$STATUS"

      - name: Run e2e smoke script via pytest
        env:
          RUN_UI_SMOKE: '1'
        run: |
          chmod +x scripts/e2e_run.sh
          pytest -q tests/test_e2e_runner.py --maxfail=1 --junitxml=pytest-e2e-report.xml 2>&1 | tee pytest-e2e.log

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-smoke-logs
          path: |
              /tmp/server.log
              tmp/generate.json
              pytest.log
              pytest-report.xml
              pytest-e2e.log
              pytest-e2e-report.xml
          if-no-files-found: ignore
