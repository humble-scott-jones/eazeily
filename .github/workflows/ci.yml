name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    env:
      FLASK_ENV: development
      RUN_E2E: '0'
      RUN_UI_SMOKE: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright (optional)
        if: env.RUN_E2E == '1'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps

      - name: Run tests
        env:
          TEST_DB_PATH: ${{ runner.temp }}/togetherly-test.db
          HEADLESS: '1'
        run: |
          set -eo pipefail
          export SECRET_KEY="${SECRET_KEY:-ci-default-secret}"
          export STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY:-sk_test_dummy}"
          export STRIPE_PUBLISHABLE_KEY="${STRIPE_PUBLISHABLE_KEY:-pk_test_dummy}"
          export STRIPE_PRICE_ID="${STRIPE_PRICE_ID:-price_test_dummy}"
          export STRIPE_TEST_PRICE_ID="${STRIPE_TEST_PRICE_ID:-price_test_dummy}"
          export STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET:-whsec_test_dummy}"
          export ADMIN_EMAILS="${ADMIN_EMAILS:-admin@example.com}"

          python --version
          if [ -n "${SECRET_KEY:-}" ]; then echo "SECRET_KEY is set"; else echo "SECRET_KEY is empty"; fi
          pytest -q
