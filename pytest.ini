[pytest]
addopts = -q

[markers]
ui: mark tests as UI/smoke tests that require the server

[coverage:run]
source = .
omit = 
    .venv/*
    tests/*
    */site-packages/*
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

