[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway will use the CMD from Dockerfile when builder is DOCKERFILE
# Use the liveness endpoint so Railway considers the process up as soon as
# the WSGI server is running. Readiness (`/readyz`) still reports dependency
# health (DB, Stripe) but is not used for the basic deploy liveness probe.
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
