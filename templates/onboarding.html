{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-3xl font-bold mb-2 text-gray-800">Build Your Brand Brain</h2>
    <p class="text-gray-600 mb-6">Let's capture your business identity in seconds with our "Lazy Mode" onboarding.</p>
    
    <form id="onboardingForm" method="POST" action="/onboarding" class="space-y-6">
        <!-- Business Name -->
        <div>
            <label for="business_name" class="block text-sm font-medium text-gray-700">Business Name</label>
            <input type="text" id="business_name" name="business_name" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                   placeholder="e.g., Smith Real Estate">
        </div>

        <!-- Industry Dropdown -->
        <div>
            <label for="industry" class="block text-sm font-medium text-gray-700">Industry</label>
            <select id="industry" name="industry" onchange="prefill()" required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                <option value="">Select your industry...</option>
                <option value="Software / Tech / Startup">💻 Software / Tech / Startup</option>
                <option value="Realtor / Real Estate">🏡 Realtor / Real Estate</option>
                <option value="Restaurant / Café">🍽️ Restaurant / Café</option>
                <option value="Retail / Boutique">🛍️ Retail / Boutique</option>
                <option value="Fitness / Wellness">💪 Fitness / Wellness</option>
                <option value="Artisan / Maker">🎨 Artisan / Maker</option>
                <option value="Coach / Consultant">🧭 Coach / Consultant</option>
                <option value="Nonprofit / Community">🤝 Nonprofit / Community</option>
                <option value="Home Services">🛠️ Home Services</option>
                <option value="Healthcare">🩺 Healthcare</option>
                <option value="Church">⛪ Church</option>
                <option value="House Host / Vacation Rental">🏠 House Host / Vacation Rental</option>
                <option value="Other / Custom">✨ Other / Custom</option>
            </select>
        </div>

        <!-- Target Audience -->
        <div>
            <label for="audience" class="block text-sm font-medium text-gray-700">
                Target Audience <span class="text-gray-500">(The "Who")</span>
            </label>
            <textarea id="audience" name="target_audience" rows="3" required
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                      placeholder="e.g., Local families looking to upsize..."></textarea>
        </div>

        <!-- Brand Voice -->
        <div>
            <label for="voice" class="block text-sm font-medium text-gray-700">
                Brand Voice <span class="text-gray-500">(The "Vibe")</span>
                <button type="button" onclick="startVoiceChat()" class="ml-2 text-blue-600 hover:text-blue-800 text-xs">
                    💬 Build with AI Chat
                </button>
            </label>
            <input type="text" id="voice" name="brand_voice" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                   placeholder="e.g., Professional, reassuring, and expert-level">
            
            <!-- AI Chat Interface (hidden by default) -->
            <div id="voiceChatInterface" style="display: none;" class="mt-3 border border-gray-300 rounded-lg bg-white shadow-sm">
                <!-- Chat Messages Container -->
                <div id="chatMessages" class="p-4 max-h-96 overflow-y-auto space-y-3">
                    <!-- Messages will be added here dynamically -->
                </div>
                
                <!-- Chat Input Area -->
                <div class="border-t border-gray-200 p-3 bg-gray-50">
                    <div class="flex items-start space-x-2">
                        <textarea id="chatInput" rows="2"
                                  class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border resize-none"
                                  placeholder="Type your response..."></textarea>
                        <button type="button" onclick="sendChatMessage()" 
                                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm h-full">
                            Send
                        </button>
                    </div>
                    <button type="button" onclick="closeVoiceChat()" 
                            class="mt-2 text-xs text-gray-600 hover:text-gray-800">
                        ✕ Close chat
                    </button>
                </div>
            </div>
        </div>

        <!-- Key Offer -->
        <div>
            <label for="offer" class="block text-sm font-medium text-gray-700">
                Key Offer <span class="text-gray-500">(The "Hook")</span>
            </label>
            <textarea id="offer" name="key_offer" rows="2" required
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                      placeholder="e.g., Free Home Valuation Report"></textarea>
        </div>

        <!-- Voice Rules -->
        <div>
            <label for="rules" class="block text-sm font-medium text-gray-700">
                Voice Rules/Constraints <span class="text-gray-500">(The "Constraints")</span>
            </label>
            <textarea id="rules" name="voice_rules" rows="3"
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                      placeholder="e.g., Use 'y'all', No exclamation points, Keep it under 280 characters"></textarea>
        </div>

        <!-- Writing Samples -->
        <div>
            <label for="samples" class="block text-sm font-medium text-gray-700">
                Writing Samples <span class="text-gray-500">(The "Rhythm")</span>
            </label>
            <textarea id="samples" name="writing_samples" rows="6" required
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border font-mono text-sm"
                      placeholder="Paste 2-3 examples of your past writing here. Separate each sample with a blank line.

Example:
Just closed on another dream home in Brookside! 🏡 Congrats to the Martinez family!

Looking to sell? Let's chat about what your home is worth in today's market."></textarea>
            <p class="mt-1 text-xs text-gray-500">Paste 2-3 examples of your past writing. The AI will learn your rhythm and vocabulary.</p>
        </div>

        <button type="submit" id="submitBtn"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Save Brand Profile
        </button>
    </form>
</div>

<script>
// Industry defaults for "Lazy Mode" prefilling
const defaults = {
    'Software / Tech / Startup': {
        audience: "Businesses, developers, and teams seeking innovative software solutions to improve efficiency and scalability.",
        voice: "Clear, innovative, and results-driven with a focus on solving real problems.",
        offer: "Free trial or live demo of our platform."
    },
    'Realtor / Real Estate': {
        audience: "Local families looking to upsize or first-time buyers seeking guidance.",
        voice: "Professional, reassuring, and expert-level.",
        offer: "Free Home Valuation Report."
    },
    'Restaurant / Café': {
        audience: "Food lovers and families seeking authentic dining experiences.",
        voice: "Warm, inviting, and mouth-watering.",
        offer: "15% off your first visit or complimentary appetizer."
    },
    'Retail / Boutique': {
        audience: "Style-conscious shoppers looking for unique finds and personalized service.",
        voice: "Friendly, trendy, and approachable.",
        offer: "10% off your first purchase or early access to new arrivals."
    },
    'Fitness / Wellness': {
        audience: "Busy professionals looking to build sustainable fitness habits.",
        voice: "Motivating, energetic, and supportive.",
        offer: "Free 7-day trial membership."
    },
    'Artisan / Maker': {
        audience: "Creative hobbyists and conscious consumers seeking handmade quality.",
        voice: "Inspirational, earthy, and authentic.",
        offer: "10% off your first handcrafted piece or free shipping."
    },
    'Coach / Consultant': {
        audience: "Business leaders and professionals seeking strategic guidance and proven frameworks.",
        voice: "Authoritative, insightful, and results-driven.",
        offer: "Free 30-minute strategy session."
    },
    'Nonprofit / Community': {
        audience: "Community members passionate about making a local impact.",
        voice: "Heartfelt, inspiring, and mission-focused.",
        offer: "Join us at our next volunteer event or learn how your donation helps."
    },
    'Home Services': {
        audience: "Homeowners looking for reliable, quality service and maintenance.",
        voice: "Trustworthy, professional, and helpful.",
        offer: "Free estimate or 10% off first service."
    },
    'Healthcare': {
        audience: "Patients and families seeking compassionate, quality healthcare.",
        voice: "Caring, professional, and informative.",
        offer: "New patient consultation or same-day appointments available."
    },
    'Church': {
        audience: "Community members seeking spiritual growth and fellowship.",
        voice: "Welcoming, uplifting, and encouraging.",
        offer: "Join us this Sunday or explore our community groups."
    },
    'House Host / Vacation Rental': {
        audience: "Travelers seeking authentic, comfortable, and memorable stays.",
        voice: "Warm, hospitable, and detail-oriented.",
        offer: "10% off your first booking or free local activity guide."
    },
    'Other / Custom': {
        audience: "Your target customers or community.",
        voice: "Authentic and true to your brand.",
        offer: "Your special offer or value proposition."
    }
};

function prefill() {
    const industry = document.getElementById('industry').value;
    if (defaults[industry]) {
        document.getElementById('audience').value = defaults[industry].audience;
        document.getElementById('voice').value = defaults[industry].voice;
        document.getElementById('offer').value = defaults[industry].offer;
    }
}

// Voice Chat Interface
let chatState = {
    stage: 'initial', // initial, analyzing_links, asking_questions, complete
    collectedData: {},
    conversationHistory: []
};

function startVoiceChat() {
    const businessName = document.getElementById('business_name').value;
    const industry = document.getElementById('industry').value;
    
    if (!businessName || !industry) {
        alert('Please fill in your business name and industry first.');
        return;
    }
    
    const chatInterface = document.getElementById('voiceChatInterface');
    const chatMessages = document.getElementById('chatMessages');
    
    // Reset chat state
    chatState = {
        stage: 'initial',
        collectedData: { business_name: businessName, industry: industry },
        conversationHistory: []
    };
    
    // Clear previous messages
    chatMessages.innerHTML = '';
    
    // Show chat interface
    chatInterface.style.display = 'block';
    
    // Add initial AI message
    addAIMessage(
        "Hi! I'm here to help build your brand voice profile. 🎨\n\n" +
        "To get started, please share any links where I can see your brand's voice - like your website, Facebook page, Instagram, LinkedIn, or any social media profiles.\n\n" +
        "Just paste the URLs below (one per line or separated by spaces):"
    );
}

function addAIMessage(message) {
    const chatMessages = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = 'flex items-start space-x-2';
    messageDiv.innerHTML = `
        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-semibold text-sm">
            AI
        </div>
        <div class="flex-1 bg-gray-100 rounded-lg p-3 text-sm" style="white-space: pre-wrap;">${escapeHtml(message)}</div>
    `;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function addUserMessage(message) {
    const chatMessages = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = 'flex items-start space-x-2 flex-row-reverse';
    messageDiv.innerHTML = `
        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-semibold text-sm">
            You
        </div>
        <div class="flex-1 bg-blue-600 text-white rounded-lg p-3 text-sm" style="white-space: pre-wrap;">${escapeHtml(message)}</div>
    `;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function addLoadingMessage() {
    const chatMessages = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.id = 'loadingMessage';
    messageDiv.className = 'flex items-start space-x-2';
    messageDiv.innerHTML = `
        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-semibold text-sm">
            AI
        </div>
        <div class="flex-1 bg-gray-100 rounded-lg p-3 text-sm">
            <span class="inline-block animate-pulse">●</span>
            <span class="inline-block animate-pulse" style="animation-delay: 0.2s;">●</span>
            <span class="inline-block animate-pulse" style="animation-delay: 0.4s;">●</span>
        </div>
    `;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function removeLoadingMessage() {
    const loadingMsg = document.getElementById('loadingMessage');
    if (loadingMsg) {
        loadingMsg.remove();
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function sendChatMessage() {
    const chatInput = document.getElementById('chatInput');
    const userMessage = chatInput.value.trim();
    
    if (!userMessage) {
        return;
    }
    
    // Add user message to chat
    addUserMessage(userMessage);
    chatInput.value = '';
    
    // Add to conversation history
    chatState.conversationHistory.push({ role: 'user', message: userMessage });
    
    // Show loading indicator
    addLoadingMessage();
    
    // Send to backend for processing
    try {
        const response = await fetch('/onboarding/voice-chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                business_name: chatState.collectedData.business_name,
                industry: chatState.collectedData.industry,
                user_message: userMessage,
                conversation_history: chatState.conversationHistory,
                stage: chatState.stage
            })
        });
        
        removeLoadingMessage();
        
        const data = await response.json();
        
        if (response.ok) {
            // Add AI response
            addAIMessage(data.ai_message);
            
            // Update chat state
            chatState.stage = data.stage;
            chatState.conversationHistory.push({ role: 'ai', message: data.ai_message });
            
            // If we have a brand voice result, fill it in
            if (data.brand_voice) {
                document.getElementById('voice').value = data.brand_voice;
            }
            
            // If we have target audience, fill it in
            if (data.target_audience) {
                document.getElementById('audience').value = data.target_audience;
            }
            
            // If chat is complete, show success message and option to close
            if (data.stage === 'complete') {
                setTimeout(() => {
                    addAIMessage("✅ All done! Your brand voice profile has been filled in. You can close this chat or continue to refine the details.");
                }, 1000);
            }
        } else {
            addAIMessage('Sorry, I encountered an error: ' + (data.error || 'Please try again.'));
        }
    } catch (error) {
        console.error('Error:', error);
        removeLoadingMessage();
        addAIMessage('Sorry, something went wrong. Please try again.');
    }
}

function closeVoiceChat() {
    const chatInterface = document.getElementById('voiceChatInterface');
    chatInterface.style.display = 'none';
}

// Allow Enter key to send message (Shift+Enter for new line)
document.addEventListener('DOMContentLoaded', function() {
    const chatInput = document.getElementById('chatInput');
    if (chatInput) {
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });
    }
});
</script>
{% endblock %}
