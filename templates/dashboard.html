{% extends "base_chat.html" %}

{% block title %}Dashboard - Eazeily{% endblock %}

{% block body %}
<div class="chat-page">
    <!-- Minimal Header -->
    <header class="app-header">
        <div class="header-left">
            <button id="menu-toggle" class="menu-btn" aria-label="Open menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round"/>
                </svg>
            </button>
            <span class="app-logo">✨ Eazeily</span>
        </div>
        <div class="header-right">
            <!-- Profile Badge -->
            <div id="profile-badge" class="profile-badge" onclick="handleProfileBadgeClick()">
                <div class="badge-circle">
                    <svg class="badge-progress" viewBox="0 0 36 36">
                        <circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--border)" stroke-width="3"/>
                        <circle id="progress-circle" cx="18" cy="18" r="15.5" fill="none" 
                                stroke="var(--accent)" stroke-width="3"
                                stroke-dasharray="97.4" stroke-dashoffset="97.4"
                                stroke-linecap="round" transform="rotate(-90 18 18)"/>
                    </svg>
                    <span id="badge-percent" class="badge-text">--%</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Slide-out Navigation Menu -->
    <div id="nav-overlay" class="nav-overlay hidden" onclick="closeMenu()"></div>
    <nav id="nav-menu" class="nav-menu">
        <div class="menu-header">
            <span class="menu-title">✨ Eazeily</span>
            <button onclick="closeMenu()" class="close-btn" aria-label="Close menu">✕</button>
        </div>
        <div class="menu-items">
            <a href="#" onclick="menuAction('profile')" class="menu-item">
                <span class="menu-icon">👤</span>
                <span>Profile</span>
                <span id="menu-profile-badge" class="menu-badge">--%</span>
            </a>
            <a href="#" onclick="menuAction('saved')" class="menu-item">
                <span class="menu-icon">📚</span>
                <span>Saved Posts</span>
            </a>
            <a href="/profile" class="menu-item">
                <span class="menu-icon">⚙️</span>
                <span>Settings</span>
            </a>
            <hr class="menu-divider">
            <a href="#" onclick="menuAction('help')" class="menu-item">
                <span class="menu-icon">❓</span>
                <span>Help & Commands</span>
            </a>
            <a href="/auth/logout" class="menu-item menu-item-danger">
                <span class="menu-icon">🚪</span>
                <span>Logout</span>
            </a>
        </div>
    </nav>

    <!-- Chat Messages Area -->
    <main id="chat-container" class="chat-container">
        <div id="chat-messages" class="chat-messages">
            <!-- Messages render here via PromptBox in embedded mode -->
            <div id="dashboard-promptbox" class="promptbox-full-height"></div>
        </div>
    </main>

    <!-- Sticky Input Area -->
    <footer class="input-container">
        <!-- Autocomplete for slash commands -->
        <div id="autocomplete-container" class="autocomplete-container hidden" role="listbox">
            <!-- Slash command autocomplete will be rendered here -->
        </div>
        
        <!-- Slash command hint -->
        <div id="slash-hint" class="slash-hint hidden">
            💡 Type <kbd>/</kbd> to see commands
        </div>
        
        <div class="input-wrapper">
            <textarea 
                id="chat-input" 
                class="chat-input" 
                placeholder="What do you want to create?"
                rows="1"
                aria-label="Message input"
            ></textarea>
            <button id="send-btn" class="send-btn" disabled aria-label="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </footer>
</div>

{% endblock %}

{% block scripts %}
<!-- Navigation & Chat Scripts -->
<script src="/static/js/navigation.js"></script>
<script src="/static/js/promptbox.js"></script>

<script>
// Initialize chat input handlers
document.addEventListener('DOMContentLoaded', function() {
    // Initialize profile badge
    initProfileBadge();
    
    // Initialize PromptBox
    initPromptBox();
});

/**
 * Auto-resize textarea
 * @param {HTMLTextAreaElement} textarea - Textarea element
 */
function autoResizeTextarea(textarea) {
    textarea.style.height = 'auto';
    const minHeight = 44; // Min height for touch targets
    const maxHeight = 120; // Max 4 lines approx
    const newHeight = Math.max(minHeight, Math.min(textarea.scrollHeight, maxHeight));
    textarea.style.height = `${newHeight}px`;
}

/**
 * Initialize profile badge
 */
async function initProfileBadge() {
    try {
        const response = await fetch('/api/profile', { credentials: 'include' });
        const data = await response.json();
        
        if (data.ok && data.profile) {
            updateProfileBadge(data.profile);
        } else {
            updateProfileBadge(null);
        }
    } catch (error) {
        console.error('Failed to load profile for badge:', error);
    }
}

/**
 * Update profile badge with completion percentage
 * @param {object} profile - Profile object
 */
function updateProfileBadge(profile) {
    const { missing, percent } = profile 
        ? checkProfileCompleteness(profile) 
        : { missing: ['Everything'], percent: 0 };
    
    // Update circular progress (97.4 is circumference)
    const circle = document.getElementById('progress-circle');
    if (circle) {
        const offset = 97.4 - (97.4 * percent / 100);
        circle.style.strokeDashoffset = offset;
        circle.style.stroke = percent >= 80 ? 'var(--success)' : percent >= 50 ? '#f59e0b' : 'var(--accent)';
    }
    
    const percentText = document.getElementById('badge-percent');
    if (percentText) percentText.textContent = `${percent}%`;
    
    // Update menu badge
    const menuBadge = document.getElementById('menu-profile-badge');
    if (menuBadge) menuBadge.textContent = `${percent}%`;
}

/**
 * Check profile completeness
 * @param {object} profile - Profile object
 * @returns {object} {missing: [], percent: number}
 */
function checkProfileCompleteness(profile) {
    const fields = {
        'Business Name': profile.company || profile.business_name,
        'Industry': profile.industry,
        'Brand Voice': profile.tone || profile.brand_voice,
        'Target Audience': profile.target_audience,
        'Key Offer': profile.key_offer,
        'Writing Samples': profile.writing_samples?.length > 0,
    };
    
    const missing = [];
    let filled = 0;
    
    for (const [label, value] of Object.entries(fields)) {
        if (value && (typeof value === 'boolean' ? value : String(value).trim())) {
            filled++;
        } else {
            missing.push(label);
        }
    }
    
    const percent = Math.round((filled / Object.keys(fields).length) * 100);
    return { isComplete: missing.length === 0, missing, percent };
}

/**
 * Initialize PromptBox
 */
async function initPromptBox() {
    // PromptBox handles its own container rendering in embedded mode
    if (typeof PromptBox !== 'undefined') {
        const promptBox = new PromptBox('dashboard-promptbox', {
            embedded: true, // Only render messages, page provides header/input
            context: 'dashboard',
            placeholder: 'What do you want to create today?',
            onSend: async (message, pb) => {
                // Use the default API handler
                await pb.sendToAPI(message);
            }
        });
        
        // Store globally for page input integration
        window.dashboardPromptBox = promptBox;
        
        // Check if this is a new user from server-side flag
        const isNewUser = {{ 'true' if is_new_user else 'false' }};
        
        if (isNewUser) {
            // Show onboarding welcome for new users
            promptBox.showOnboardingWelcome();
            
            // Set up onboarding state
            window.onboardingState = 'awaiting_business_name';
            window.onboardingData = {};
        } else {
            // Check profile and show contextual welcome for existing users
            await promptBox.initWithProfileContext();
        }
        
        // Connect page input to PromptBox
        connectPageInputToPromptBox(promptBox);
    }
}

/**
 * Connect page-level input to PromptBox in embedded mode
 * @param {PromptBox} promptBox - The PromptBox instance
 */
function connectPageInputToPromptBox(promptBox) {
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    
    if (!chatInput || !sendBtn) return;
    
    // Handle input changes for autocomplete
    chatInput.addEventListener('input', (e) => {
        const value = e.target.value;
        autoResizeTextarea(chatInput);
        sendBtn.disabled = !value.trim();
        
        // Handle slash commands for autocomplete
        handleSlashCommandAutocomplete(value);
    });
    
    // Handle Enter key
    chatInput.addEventListener('keydown', (e) => {
        // Check if autocomplete is open
        const autocomplete = document.getElementById('autocomplete-container');
        if (autocomplete && !autocomplete.classList.contains('hidden')) {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                navigateAutocomplete('down');
                return;
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                navigateAutocomplete('up');
                return;
            } else if (e.key === 'Enter' || e.key === 'Tab') {
                const selectedItem = autocomplete.querySelector('.autocomplete-item.selected');
                if (selectedItem) {
                    e.preventDefault();
                    selectAutocompleteItem(selectedItem.dataset.command);
                    return;
                }
            } else if (e.key === 'Escape') {
                e.preventDefault();
                hideAutocomplete();
                return;
            }
        }
        
        // Normal Enter handling
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (e.target.value.trim()) {
                handlePageChatSend(promptBox);
            }
        }
    });
    
    // Handle send button click
    sendBtn.addEventListener('click', () => {
        handlePageChatSend(promptBox);
    });
}

/**
 * Handle sending message from page input to PromptBox
 * @param {PromptBox} promptBox - The PromptBox instance
 */
async function handlePageChatSend(promptBox) {
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const message = chatInput.value.trim();
    
    if (!message) return;
    
    // Clear input
    chatInput.value = '';
    autoResizeTextarea(chatInput);
    sendBtn.disabled = true;
    hideAutocomplete();
    
    // Send message to PromptBox
    await promptBox.sendMessage(message);
}

/**
 * Handle slash command autocomplete
 * @param {string} value - Input value
 */
function handleSlashCommandAutocomplete(value) {
    const chatInput = document.getElementById('chat-input');
    
    // Check if value starts with /
    if (value.startsWith('/')) {
        // Show slash hint on first use
        const slashHint = document.getElementById('slash-hint');
        const hasUsedSlash = localStorage.getItem('eazeily_used_slash') === 'true';
        if (!hasUsedSlash && slashHint) {
            slashHint.classList.remove('hidden');
            localStorage.setItem('eazeily_used_slash', 'true');
            // Hide after showing briefly
            setTimeout(() => {
                slashHint.classList.add('fade-out');
                setTimeout(() => slashHint.classList.add('hidden'), 300);
            }, 2000);
        }
        
        const query = value.slice(1).toLowerCase();
        
        // Use global SLASH_COMMANDS from promptbox.js (loaded via script tag)
        if (typeof SLASH_COMMANDS === 'undefined') {
            console.error('SLASH_COMMANDS not loaded from promptbox.js - autocomplete disabled');
            hideAutocomplete();
            return;
        }
        
        const matches = SLASH_COMMANDS.filter(cmd => 
            cmd.command.slice(1).toLowerCase().startsWith(query)
        );
        
        if (matches.length > 0) {
            showAutocomplete(matches);
            chatInput.classList.add('has-slash-command');
        } else {
            hideAutocomplete();
            chatInput.classList.remove('has-slash-command');
        }
    } else {
        hideAutocomplete();
        chatInput.classList.remove('has-slash-command');
    }
}

/**
 * Show autocomplete dropdown
 * @param {Array} commands - Array of command objects
 */
function showAutocomplete(commands) {
    const container = document.getElementById('autocomplete-container');
    if (!container) return;
    
    const html = commands.map((cmd, index) => `
        <div class="autocomplete-item ${index === 0 ? 'selected' : ''}" data-index="${index}" data-command="${escapeHtml(cmd.command)}">
            <span class="autocomplete-icon">${cmd.icon}</span>
            <div class="autocomplete-text">
                <span class="autocomplete-command">${escapeHtml(cmd.command)}</span>
                <span class="autocomplete-desc">${escapeHtml(cmd.description)}</span>
            </div>
        </div>
    `).join('');
    
    container.innerHTML = html;
    container.classList.remove('hidden');
    
    // Add click handlers
    container.querySelectorAll('.autocomplete-item').forEach((item, index) => {
        item.addEventListener('click', () => {
            selectAutocompleteItem(item.dataset.command);
        });
    });
}

/**
 * Navigate autocomplete with arrow keys
 * @param {string} direction - 'up' or 'down'
 */
function navigateAutocomplete(direction) {
    const container = document.getElementById('autocomplete-container');
    if (!container || container.classList.contains('hidden')) return;
    
    const items = Array.from(container.querySelectorAll('.autocomplete-item'));
    if (items.length === 0) return;
    
    const currentIndex = items.findIndex(item => item.classList.contains('selected'));
    let newIndex;
    
    if (direction === 'down') {
        newIndex = currentIndex < items.length - 1 ? currentIndex + 1 : 0;
    } else {
        newIndex = currentIndex > 0 ? currentIndex - 1 : items.length - 1;
    }
    
    // Remove selected class from all items
    items.forEach(item => item.classList.remove('selected'));
    
    // Add selected class to new item
    items[newIndex].classList.add('selected');
    
    // Scroll into view
    items[newIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/**
 * Hide autocomplete dropdown
 */
function hideAutocomplete() {
    const container = document.getElementById('autocomplete-container');
    if (container) {
        container.classList.add('hidden');
        container.innerHTML = '';
    }
    window.selectedAutocompleteIndex = -1;
}

/**
 * Select an autocomplete item
 * @param {string} command - Command to insert
 */
function selectAutocompleteItem(command) {
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    
    if (chatInput) {
        chatInput.value = command + ' ';
        autoResizeTextarea(chatInput);
        sendBtn.disabled = false;
        hideAutocomplete();
        chatInput.focus();
    }
}

/**
 * Escape HTML to prevent XSS
 * @param {string} text - Text to escape
 * @returns {string} Escaped text
 */
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>

{% endblock %}
