{% extends "base.html" %}

{% block content %}
<div class="chat-page">
    <!-- Minimal Header -->
    <header class="app-header">
        <div class="header-left">
            <button id="menu-toggle" class="menu-btn" aria-label="Open menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round"/>
                </svg>
            </button>
            <span class="app-logo">✨ Eazeily</span>
        </div>
        <div class="header-right">
            <!-- Profile Badge -->
            <div id="profile-badge" class="profile-badge" onclick="handleProfileBadgeClick()">
                <div class="badge-circle">
                    <svg class="badge-progress" viewBox="0 0 36 36">
                        <circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--border)" stroke-width="3"/>
                        <circle id="progress-circle" cx="18" cy="18" r="15.5" fill="none" 
                                stroke="var(--accent)" stroke-width="3"
                                stroke-dasharray="97.4" stroke-dashoffset="97.4"
                                stroke-linecap="round" transform="rotate(-90 18 18)"/>
                    </svg>
                    <span id="badge-percent" class="badge-text">--%</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Slide-out Navigation Menu -->
    <div id="nav-overlay" class="nav-overlay hidden" onclick="closeMenu()"></div>
    <nav id="nav-menu" class="nav-menu">
        <div class="menu-header">
            <span class="menu-title">✨ Eazeily</span>
            <button onclick="closeMenu()" class="close-btn" aria-label="Close menu">✕</button>
        </div>
        <div class="menu-items">
            <a href="#" onclick="menuAction('profile')" class="menu-item">
                <span class="menu-icon">👤</span>
                <span>Profile</span>
                <span id="menu-profile-badge" class="menu-badge">--%</span>
            </a>
            <a href="#" onclick="menuAction('saved')" class="menu-item">
                <span class="menu-icon">📚</span>
                <span>Saved Posts</span>
            </a>
            <a href="/profile" class="menu-item">
                <span class="menu-icon">⚙️</span>
                <span>Settings</span>
            </a>
            <hr class="menu-divider">
            <a href="#" onclick="menuAction('help')" class="menu-item">
                <span class="menu-icon">❓</span>
                <span>Help & Commands</span>
            </a>
            <a href="/auth/logout" class="menu-item menu-item-danger">
                <span class="menu-icon">🚪</span>
                <span>Logout</span>
            </a>
        </div>
    </nav>

    <!-- Chat Messages Area -->
    <main id="chat-container" class="chat-container">
        <div id="chat-messages" class="chat-messages">
            <!-- Messages render here via PromptBox -->
            <div id="dashboard-promptbox" class="promptbox-full-height"></div>
        </div>
    </main>

    <!-- Sticky Input Area -->
    <footer class="input-container">
        <div class="input-wrapper">
            <textarea 
                id="chat-input" 
                class="chat-input" 
                placeholder="What do you want to create?"
                rows="1"
                aria-label="Message input"
            ></textarea>
            <button id="send-btn" class="send-btn" disabled aria-label="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </footer>
</div>

<!-- Navigation & Chat Scripts -->
<script src="/static/js/navigation.js"></script>
<script src="/static/js/promptbox.js"></script>

<script>
// Initialize chat input handlers
document.addEventListener('DOMContentLoaded', function() {
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    
    if (chatInput && sendBtn) {
        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
            autoResizeTextarea(chatInput);
            sendBtn.disabled = !chatInput.value.trim();
        });
        
        // Send on Enter (Shift+Enter for new line)
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (chatInput.value.trim()) {
                    handleChatSend();
                }
            }
        });
        
        // Send button click
        sendBtn.addEventListener('click', handleChatSend);
    }
    
    // Initialize profile badge
    initProfileBadge();
    
    // Initialize PromptBox
    initPromptBox();
});

/**
 * Handle chat message send
 */
async function handleChatSend() {
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const message = chatInput.value.trim();
    
    if (!message) return;
    
    // Add user message to chat
    addChatMessage('user', message);
    
    // Clear input
    chatInput.value = '';
    autoResizeTextarea(chatInput);
    sendBtn.disabled = true;
    
    // Show loading
    showChatLoading(true);
    
    try {
        // Send to API
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: message,
                context: 'dashboard'
            })
        });
        
        const data = await response.json();
        
        if (response.ok && data.response) {
            // Check if we have options/variants
            if (data.options && data.options.length > 0) {
                // Render with per-option copy buttons
                const html = renderOptionsContent(data.options);
                addChatMessageHTML(html);
                window.lastGeneratedOptions = data.options;
            } else {
                // Single response
                addChatMessage('assistant', data.response);
                window.lastGeneratedContent = data.response;
            }
        } else {
            addChatMessage('assistant', data.error || 'Sorry, something went wrong. Please try again.');
        }
    } catch (error) {
        console.error('Chat error:', error);
        addChatMessage('assistant', 'Sorry, something went wrong. Please try again.');
    } finally {
        showChatLoading(false);
    }
}

/**
 * Add a chat message
 * @param {string} role - 'user' or 'assistant'
 * @param {string} content - Message content
 */
function addChatMessage(role, content) {
    const messagesContainer = document.getElementById('chat-messages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `chat-message message-${role}`;
    messageDiv.textContent = content;
    messagesContainer.appendChild(messageDiv);
    
    // Scroll to bottom
    const chatContainer = document.getElementById('chat-container');
    if (chatContainer) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
}

/**
 * Add chat message from HTML
 * @param {string} html - HTML content
 */
function addChatMessageHTML(html) {
    const messagesContainer = document.getElementById('chat-messages');
    const messageDiv = document.createElement('div');
    messageDiv.className = 'chat-message';
    messageDiv.innerHTML = html;
    messagesContainer.appendChild(messageDiv);
    
    // Scroll to bottom
    const chatContainer = document.getElementById('chat-container');
    if (chatContainer) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
}

/**
 * Render options with individual copy buttons
 * @param {array} options - Array of option objects
 * @returns {string} HTML string
 */
function renderOptionsContent(options) {
    let html = `
        <div class="message-assistant">
            <p class="message-intro">📝 Your content is ready!</p>
            <div class="options-container">
    `;
    
    options.forEach((opt, index) => {
        const text = opt.text || opt;
        const label = opt.label || '';
        html += `
            <div class="option-card" data-option-index="${index}">
                <div class="option-header">
                    <span class="option-label">Option ${index + 1}${label ? ': ' + label : ''}</span>
                    <button class="copy-btn" onclick="copyOption(${index})" data-index="${index}">
                        <span class="copy-icon">📋</span>
                        <span class="copy-text">Copy</span>
                    </button>
                </div>
                <div class="option-content">${escapeHtml(text)}</div>
            </div>
        `;
    });
    
    html += `
            </div>
            <div class="action-bar">
                <button class="action-btn" onclick="handleAction('regenerate')" title="Regenerate">
                    <span class="action-icon">🔄</span>
                    <span class="action-label">Regenerate</span>
                </button>
                <button class="action-btn" onclick="handleAction('shorter')" title="Make shorter">
                    <span class="action-icon">✂️</span>
                    <span class="action-label">Shorter</span>
                </button>
                <button class="action-btn" onclick="handleAction('casual')" title="More casual">
                    <span class="action-icon">😊</span>
                    <span class="action-label">Casual</span>
                </button>
                <button class="action-btn" onclick="handleAction('different')" title="Different angle">
                    <span class="action-icon">🎨</span>
                    <span class="action-label">Different</span>
                </button>
            </div>
        </div>
    `;
    
    return html;
}

/**
 * Escape HTML to prevent XSS
 * @param {string} text - Text to escape
 * @returns {string} Escaped text
 */
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

/**
 * Show/hide loading indicator
 * @param {boolean} show - Whether to show loading
 */
function showChatLoading(show) {
    // For now, just disable the input
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    
    if (chatInput) chatInput.disabled = show;
    if (sendBtn) sendBtn.disabled = show;
    
    // Could add a loading message here if needed
}

/**
 * Initialize profile badge
 */
async function initProfileBadge() {
    try {
        const response = await fetch('/api/profile', { credentials: 'include' });
        const data = await response.json();
        
        if (data.ok && data.profile) {
            updateProfileBadge(data.profile);
        } else {
            updateProfileBadge(null);
        }
    } catch (error) {
        console.error('Failed to load profile for badge:', error);
    }
}

/**
 * Update profile badge with completion percentage
 * @param {object} profile - Profile object
 */
function updateProfileBadge(profile) {
    const { missing, percent } = profile 
        ? checkProfileCompleteness(profile) 
        : { missing: ['Everything'], percent: 0 };
    
    // Update circular progress (97.4 is circumference)
    const circle = document.getElementById('progress-circle');
    if (circle) {
        const offset = 97.4 - (97.4 * percent / 100);
        circle.style.strokeDashoffset = offset;
        circle.style.stroke = percent >= 80 ? 'var(--success)' : percent >= 50 ? '#f59e0b' : 'var(--accent)';
    }
    
    const percentText = document.getElementById('badge-percent');
    if (percentText) percentText.textContent = `${percent}%`;
    
    // Update menu badge
    const menuBadge = document.getElementById('menu-profile-badge');
    if (menuBadge) menuBadge.textContent = `${percent}%`;
}

/**
 * Check profile completeness
 * @param {object} profile - Profile object
 * @returns {object} {missing: [], percent: number}
 */
function checkProfileCompleteness(profile) {
    const fields = {
        'Business Name': profile.company || profile.business_name,
        'Industry': profile.industry,
        'Brand Voice': profile.tone || profile.brand_voice,
        'Target Audience': profile.target_audience,
        'Key Offer': profile.key_offer,
        'Writing Samples': profile.writing_samples?.length > 0,
    };
    
    const missing = [];
    let filled = 0;
    
    for (const [label, value] of Object.entries(fields)) {
        if (value && (typeof value === 'boolean' ? value : String(value).trim())) {
            filled++;
        } else {
            missing.push(label);
        }
    }
    
    const percent = Math.round((filled / Object.keys(fields).length) * 100);
    return { isComplete: missing.length === 0, missing, percent };
}

/**
 * Initialize PromptBox
 */
async function initPromptBox() {
    // PromptBox handles its own container rendering
    if (typeof PromptBox !== 'undefined') {
        const promptBox = new PromptBox('dashboard-promptbox', {
            context: 'dashboard',
            placeholder: 'What do you want to create today?',
            onSend: async (message, pb) => {
                // Use the default API handler
                await pb.sendToAPI(message);
            }
        });
        
        // Check profile and show contextual welcome
        await promptBox.initWithProfileContext();
    }
}
</script>

{% endblock %}
