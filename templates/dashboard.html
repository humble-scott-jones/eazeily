{% extends "base.html" %}

{% block content %}
<div class="space-y-8">
    <!-- Header Section -->
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Dashboard</h1>

                <button type="button" onclick="selectTask('review')" id="task-review"

                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                    </div>

                </button>

                <button type="button" onclick="selectTask('blog')" id="task-blog" 
                        class="task-btn group relative p-4 rounded-xl border border-gray-200 hover:border-indigo-500 hover:ring-1 hover:ring-indigo-500 hover:bg-indigo-50/30 transition-all duration-200 text-left">
                    <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center mb-3 group-hover:bg-indigo-100 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                    </div>
                    <div class="font-semibold text-gray-900">Blog Post</div>
                    <div class="text-xs text-gray-500 mt-1">SEO Articles</div>
                </button>

                <button type="button" onclick="selectTask('newsletter')" id="task-newsletter" 
                        class="task-btn group relative p-4 rounded-xl border border-gray-200 hover:border-indigo-500 hover:ring-1 hover:ring-indigo-500 hover:bg-indigo-50/30 transition-all duration-200 text-left">
                    <div class="w-10 h-10 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center mb-3 group-hover:bg-rose-100 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                    </div>
                    <div class="font-semibold text-gray-900">Newsletter</div>
                    <div class="text-xs text-gray-500 mt-1">Community Updates</div>
                </button>
            </div>
            
            <form id="generateForm" class="space-y-6">
                <input type="hidden" id="task_type" name="task_type" value="post">
                
                <div class="bg-gray-50 rounded-xl p-6 border border-gray-100">
                    <div id="generator-status-banner" class="hidden mb-4 rounded-lg border px-4 py-3 text-sm" role="status"></div>

                    <div class="mb-4">
                        <label for="topic" id="topicLabel" class="block text-sm font-semibold text-gray-900 mb-2">What would you like to create?</label>
                        <div class="relative">
                            <textarea id="topic" name="topic" rows="3" required
                                   class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-base p-4"
                                   placeholder="e.g., A post about our new summer collection tailored for busy moms..."></textarea>
                            <div class="absolute bottom-3 right-3 text-gray-400 text-xs">AI-Powered</div>
                        </div>
                    </div>

                    <!-- Platform selector (only for posts) -->
                    <div id="platformSection" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="platform" class="block text-sm font-medium text-gray-700 mb-2">Platform</label>
                            <select id="platform" name="platform"
                                    class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm h-11">

                <option value="LinkedIn">LinkedIn</option>
                <option value="Instagram">Instagram</option>
                <option value="Facebook">Facebook</option>
                <option value="Twitter">Twitter</option>
            </select>
        </div>

        <button type="submit" id="generateBtn"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            <span id="btnText">Generate Post</span>
            <svg id="loadingSpinner" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
    </form>

    <div id="resultBox" class="mt-8 hidden">
        <h3 class="text-lg font-medium text-gray-900 mb-2">Generated Content:</h3>
        <div class="bg-gray-50 p-4 rounded-md border border-gray-200 relative">
            <pre id="postContent" class="whitespace-pre-wrap text-gray-700 font-sans"></pre>
            <button onclick="copyToClipboard()" class="absolute top-2 right-2 bg-white px-3 py-1 rounded border border-gray-300 text-gray-600 hover:text-gray-800 hover:border-gray-400 text-sm">
                📋 Copy
            </button>
        </div>
    </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    // Task button selection (lightweight, needed for UI updates)

<script>
    // Task button selection (lightweight, needed for UI updates)
    let currentTask = 'post';
    
    const taskConfig = {
        'post': {
            label: 'What is this post about?',
            placeholder: 'e.g., New summer collection launch',
            buttonText: 'Generate Post',
            showPlatform: true
        },
        'ad': {
            label: 'What is this ad promoting?',
            placeholder: 'e.g., 20% off all pottery classes this month',
            buttonText: 'Generate Ad',
            showPlatform: false
        },
        'email': {
            label: 'What is the email about?',
            placeholder: 'e.g., Following up on our recent conversation about home staging',
            buttonText: 'Generate Email',
            showPlatform: false
        },
        'review': {
            label: 'Paste the review here:',
            placeholder: 'e.g., Great experience! The agent was very helpful and responsive.',
            buttonText: 'Generate Reply',
            showPlatform: false
        },
        'proposal': {
            label: 'What service/project is this proposal for?',
            placeholder: 'e.g., Complete kitchen remodel for 3-bedroom home',
            buttonText: 'Generate Proposal',
            showPlatform: false
        },
        'newsletter': {
            label: 'What is the theme of this newsletter?',
            placeholder: 'e.g., Monthly wellness tips and upcoming class schedule',
            buttonText: 'Generate Newsletter',
            showPlatform: false
        },
        'blog': {
            label: 'What is the blog post topic?',
            placeholder: 'e.g., 5 tips for first-time homebuyers in today\'s market',
            buttonText: 'Generate Blog',
            showPlatform: false
        },
        'script': {
            label: 'What is this video about?',
            placeholder: 'e.g., Studio tour and pottery-making process for Reels',
            buttonText: 'Generate Script',
            showPlatform: false
        },
        'caption': {
            label: 'Describe the image:',
            placeholder: 'e.g., Photo of newly listed Victorian home with sunset lighting',
            buttonText: 'Generate Caption',
            showPlatform: false
        }
    };
    
    function selectTask(taskType) {
        currentTask = taskType;
        document.getElementById('task_type').value = taskType;
        
        // Update UI
        const config = taskConfig[taskType];
        document.getElementById('topicLabel').textContent = config.label;
        document.getElementById('topic').placeholder = config.placeholder;
        document.getElementById('btnText').textContent = config.buttonText;
        document.getElementById('platformSection').style.display = config.showPlatform ? 'block' : 'none';
        
        // Update task button styles
        document.querySelectorAll('.task-btn').forEach(btn => {
            btn.classList.remove('border-blue-600', 'bg-blue-50');
            btn.classList.add('border-gray-300');
        });
        document.getElementById('task-' + taskType).classList.remove('border-gray-300');
        document.getElementById('task-' + taskType).classList.add('border-blue-600', 'bg-blue-50');
        
        // Clear result
        document.getElementById('resultBox').classList.add('hidden');
    }
    
    // Toast notification system
    function showToast(message, tone = 'info', durationMs = 3500) {
        let container = document.getElementById('toast-container');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toast-container';
            container.className = 'fixed inset-0 pointer-events-none flex flex-col items-center mt-6 space-y-2 z-50';
            document.body.appendChild(container);
        }
        
        const toneClasses = {
            info: 'bg-slate-900/90 text-white border border-slate-800',
            error: 'bg-red-600/90 text-white border border-red-500',
            success: 'bg-emerald-600/90 text-white border border-emerald-500'
        };
        
        const toast = document.createElement('div');
        toast.className = `pointer-events-auto rounded-lg px-4 py-3 shadow-lg text-sm font-medium ${toneClasses[tone] || toneClasses.info}`;
        toast.textContent = message;
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-1', 'transition', 'duration-200');
            setTimeout(() => toast.remove(), 220);
        }, durationMs);
    }
    
    function clearStatus() {
        const statusEl = document.getElementById('generator-status-banner');
        if (statusEl) {
            statusEl.classList.add('hidden');
            statusEl.textContent = '';
        }
    }
    
    // Form submission handler
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('generateForm');
        if (form) {
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const topic = document.getElementById('topic').value;
                const platform = document.getElementById('platform').value;
                const taskType = document.getElementById('task_type').value;
                const btn = document.getElementById('generateBtn');
                const btnText = document.getElementById('btnText');
                const spinner = document.getElementById('loadingSpinner');
                const resultBox = document.getElementById('resultBox');
                const postContent = document.getElementById('postContent');

                // Loading State
                btn.disabled = true;
                btnText.textContent = 'Generating...';
                spinner.classList.remove('hidden');
                resultBox.classList.add('hidden');

                // Minimal client-side validation to match backend contract
                clearStatus();

                if (!topic || !topic.trim()) {
                    showToast('Please enter a topic.', 'error');
                    btn.disabled = false;
                    btnText.textContent = taskConfig[taskType].buttonText;
                    spinner.classList.add('hidden');
                    return;
                }
                if (taskType === 'post' && (!platform || !platform.trim())) {
                    showToast('Please select a platform for posts.', 'error');
                    btn.disabled = false;
                    btnText.textContent = taskConfig[taskType].buttonText;
                    spinner.classList.add('hidden');
                    return;
                }

                try {
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ 
                            topic, 
                            platform,
                            task_type: taskType
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.status === 'success') {
                        postContent.textContent = data.content;
                        resultBox.classList.remove('hidden');
                        showToast('Generated successfully.', 'success');
                    } else {
                        const code = data?.error?.code || 'unknown_error';
                        const message = data?.error?.message || data?.error || 'Failed to generate content';
                        showToast(`Error (${code}): ${message}`, 'error');
                        if (data && data.redirect) {
                            if (confirm('Would you like to set up your brand profile now?')) {
                                window.location.href = data.redirect;
                                return;
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showToast('An unexpected error occurred.', 'error');
                } finally {
                    // Reset State
                    btn.disabled = false;
                    btnText.textContent = taskConfig[taskType].buttonText;
                    spinner.classList.add('hidden');
                }
            });
        }
    });

    function copyToClipboard() {
        const text = document.getElementById('postContent').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        });
    }
</script>
{% endblock %}
