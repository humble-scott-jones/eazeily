<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter Effect Demo</title>
    <link rel="stylesheet" href="/static/css/promptbox.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        .demo-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        .test-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 16px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        button:hover {
            background: #4f46e5;
        }
        #demo-promptbox {
            height: 400px;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>🎨 Typewriter Effect Demo</h1>
        <p>Click the buttons below to test different message types:</p>
        
        <div class="test-buttons">
            <button onclick="testShortMessage()">Short Message</button>
            <button onclick="testLongMessage()">Long Message</button>
            <button onclick="testMarkdownMessage()">Markdown Message</button>
            <button onclick="testMultipleMessages()">Multiple Messages</button>
            <button onclick="clearMessages()">Clear</button>
        </div>
        
        <div id="demo-promptbox"></div>
    </div>

    <script src="/static/js/promptbox.js"></script>
    <script>
        // Initialize PromptBox
        const promptBox = new PromptBox('demo-promptbox', {
            context: 'dashboard',
            placeholder: 'Type a message...'
        });

        async function testShortMessage() {
            await promptBox.addMessage('user', 'Hello!');
            await promptBox.addMessage('assistant', 'Hi there! 👋');
        }

        async function testLongMessage() {
            await promptBox.addMessage('user', 'Tell me about the typewriter effect');
            const longMsg = 'The typewriter effect creates a more engaging user experience by displaying AI responses character by character. This mimics natural typing and makes the interaction feel more human and conversational.';
            await promptBox.addMessage('assistant', longMsg);
        }

        async function testMarkdownMessage() {
            await promptBox.addMessage('user', 'Show me some markdown');
            const markdownMsg = `## Typewriter Features

Here are the **key features**:

- Shows "Thinking... 🤔" indicator
- Types character-by-character
- Auto-scrolls to keep typing visible
- Shows blinking cursor during typing
- Skip typewriter for *short messages*

\`Code examples\` also work great!`;
            await promptBox.addMessage('assistant', markdownMsg);
        }

        async function testMultipleMessages() {
            await promptBox.addMessage('user', 'Can you give me multiple responses?');
            
            await promptBox.addMessage('assistant', 'Sure! Let me show you multiple AI responses in sequence.');
            
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await promptBox.addMessage('assistant', 'This is the second response. Notice how each message types out smoothly.');
            
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await promptBox.addMessage('assistant', 'And here is a third response with some **bold text** and *italic text* to show markdown support!');
        }

        function clearMessages() {
            promptBox.clearHistory();
        }

        // Show initial welcome message
        window.addEventListener('load', async () => {
            await promptBox.addMessage('assistant', 'Welcome! Click the buttons above to test the typewriter effect. 🚀');
        });
    </script>
</body>
</html>
