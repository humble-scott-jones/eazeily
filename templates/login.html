{% extends "auth_base.html" %}

{% block header_actions %}
<a href="/auth/signup" class="text-sm text-blue-600 hover:text-blue-800">Create account</a>
{% endblock %}

{% block content %}
<div class="auth-card bg-white p-8 rounded-lg shadow-lg">
    <div class="text-center mb-6">
        <h2 class="text-3xl font-bold text-gray-900">Welcome Back</h2>
        <p class="mt-2 text-sm text-gray-600">Sign in to continue to your dashboard</p>
    </div>
    
    <form id="loginForm" class="space-y-5">
        <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   placeholder="you@example.com"
                   class="mt-1 block w-full rounded-lg border-2 border-gray-300 shadow-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500 px-4 py-3 text-base transition-colors">
        </div>

        <div>
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password"
                   placeholder="Enter your password"
                   class="mt-1 block w-full rounded-lg border-2 border-gray-300 shadow-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500 px-4 py-3 text-base transition-colors">
        </div>

        <button type="submit" id="loginBtn"
                class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-base font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors mt-6">
            Sign In
        </button>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');

        btn.disabled = true;
        btn.textContent = 'Signing In...';

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password })
            });

            let data;
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.indexOf("application/json") !== -1) {
                data = await response.json();
            } else {
                const text = await response.text();
                console.error("Non-JSON response:", text);
                throw new Error("Server returned non-JSON response");
            }

            if (response.ok) {
                window.location.href = '/dashboard';
            } else {
                const errorMsg = data.error || 'Login failed';
                const errorDetails = data.details ? `\nDetails: ${data.details}` : '';
                alert(`Error: ${errorMsg}${errorDetails}`);
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An unexpected error occurred. Check console for details.');
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    });
</script>
{% endblock %}
