{% extends "auth_base.html" %}

{% block header_actions %}
<a href="/auth/login" class="text-sm text-blue-600 hover:text-blue-800">Already have an account?</a>
{% endblock %}

{% block content %}
<div class="auth-card bg-white p-8 rounded-lg shadow-lg">
    <div class="text-center mb-6">
        <h2 class="text-3xl font-bold text-gray-900">Create Your Account</h2>
        <p class="mt-2 text-sm text-gray-600">Start building your brand in minutes</p>
    </div>
    
    <form id="signupForm" class="space-y-5">
        <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   placeholder="you@example.com"
                   class="mt-1 block w-full rounded-lg border-2 border-gray-300 shadow-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500 px-4 py-3 text-base transition-colors">
        </div>

        <div>
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
            <input type="password" id="password" name="password" required autocomplete="new-password"
                   placeholder="Minimum 8 characters"
                   class="mt-1 block w-full rounded-lg border-2 border-gray-300 shadow-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500 px-4 py-3 text-base transition-colors">
            <p class="mt-1 text-xs text-gray-500">Use at least 8 characters with a mix of letters and numbers</p>
        </div>

        <button type="submit" id="signupBtn"
                class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-base font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors mt-6">
            Create Account
        </button>
    </form>
</div>

<script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('signupBtn');

        btn.disabled = true;
        btn.textContent = 'Creating Account...';

        try {
            const response = await fetch('/auth/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                window.location.href = '/dashboard';
            } else {
                alert('Error: ' + (data.error || 'Signup failed'));
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An unexpected error occurred.');
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    });
</script>
{% endblock %}
