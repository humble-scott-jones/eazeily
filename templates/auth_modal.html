<!-- Auth modal (signup / login / password reset) -->
<div id="auth-modal" class="fixed inset-0 bg-black/40 hidden z-50" role="dialog" aria-modal="true" aria-labelledby="auth-title" data-auth-view="login">
  <div class="absolute top-1/2 left-1/2 w-full max-w-md -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl p-6 shadow-2xl space-y-5" tabindex="-1">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Eazeily account</p>
        <h3 id="auth-title" class="text-2xl font-semibold text-slate-900 mt-1">Sign in</h3>
        <p id="auth-subtitle" class="text-sm text-slate-500 mt-1">Access your saved brand voice and content plans.</p>
      </div>
      <button id="auth-close" class="text-slate-500 hover:text-slate-900" aria-label="Close">✕</button>
    </div>

    <div class="flex gap-1 bg-slate-100 rounded-full p-1" role="tablist">
      <button type="button" class="flex-1 py-2 rounded-full text-sm font-semibold text-slate-600 auth-tab bg-white shadow auth-tab--active" data-auth-tab="login" aria-selected="true">Sign in</button>
      <button type="button" class="flex-1 py-2 rounded-full text-sm font-semibold text-slate-500 auth-tab" data-auth-tab="signup" aria-selected="false">Create account</button>
    </div>

    <div id="auth-message" class="hidden rounded-xl px-4 py-3 text-sm font-medium" role="status" aria-live="polite"></div>

    <div id="auth-forms" class="space-y-6">
      <form id="login-form" class="space-y-4">
        <div class="space-y-1">
          <label for="auth-email" class="text-sm font-medium text-slate-700">Email</label>
          <input id="auth-email" type="email" class="w-full input" placeholder="you@business.com" required autocomplete="email" aria-describedby="auth-message" data-autofocus />
        </div>
        <div class="space-y-1">
          <label for="auth-password" class="text-sm font-medium text-slate-700">Password</label>
          <input id="auth-password" type="password" class="w-full input" placeholder="••••••••" required autocomplete="current-password" aria-describedby="auth-message" />
        </div>
        <button type="submit" class="btn-primary w-full py-3 rounded-xl">Continue</button>
        <div class="flex items-center justify-between text-sm text-slate-500">
          <button type="button" class="text-brand hover:underline" data-auth-action="reset">Forgot password?</button>
          <button type="button" class="text-slate-600 hover:text-brand" data-auth-action="signup">Create account</button>
        </div>
      </form>

      <form id="signup-form" class="hidden space-y-4">
        <div class="space-y-1">
          <label for="signup-email" class="text-sm font-medium text-slate-700">Email</label>
          <input id="signup-email" type="email" class="w-full input" placeholder="you@business.com" required autocomplete="email" aria-describedby="auth-message" data-autofocus />
        </div>
        <div class="space-y-1">
          <label for="signup-password" class="text-sm font-medium text-slate-700">Password</label>
          <input id="signup-password" type="password" class="w-full input" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" aria-describedby="auth-message" />
          <p class="text-xs text-slate-500">You'll use this to sign in next time.</p>
        </div>
        <button type="submit" class="btn-primary w-full py-3 rounded-xl">Create free account</button>
        <p class="text-sm text-center text-slate-500">Already signed up? <button type="button" class="text-brand hover:underline" data-auth-action="login">Sign in</button></p>
      </form>

      <form id="reset-form" class="hidden space-y-4">
        <p class="text-sm text-slate-500">We'll email you reset instructions and show the token here for dev builds.</p>
        <div class="space-y-1">
          <label for="reset-email" class="text-sm font-medium text-slate-700">Email</label>
          <input id="reset-email" type="email" class="w-full input" placeholder="you@business.com" required autocomplete="email" aria-describedby="auth-message" data-autofocus />
        </div>
        <button type="submit" class="btn-primary w-full py-3 rounded-xl">Send reset link</button>
        <button type="button" class="w-full text-sm text-slate-500 hover:text-brand" data-auth-action="login">Back to sign in</button>
      </form>

      <form id="confirm-reset-form" class="hidden space-y-4">
        <p class="text-sm text-slate-500">Paste the token we sent (or use the dev token below) and choose a new password.</p>
        <div class="space-y-1">
          <label for="confirm-token" class="text-sm font-medium text-slate-700">Reset token</label>
          <input id="confirm-token" class="w-full input" placeholder="xxxx-xxxx" aria-describedby="auth-message" data-autofocus />
        </div>
        <div class="space-y-1">
          <label for="confirm-password" class="text-sm font-medium text-slate-700">New password</label>
          <input id="confirm-password" type="password" class="w-full input" placeholder="••••••••" aria-describedby="auth-message" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-primary w-full py-3 rounded-xl">Set new password</button>
        <button type="button" class="w-full text-sm text-slate-500 hover:text-brand" data-auth-action="login">Back to sign in</button>
      </form>
    </div>
  </div>
</div>
