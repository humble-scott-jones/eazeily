<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eazeily - Gemini Native</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="min-h-screen flex">
        <!-- Mobile Menu Toggle Button -->
        <button id="mobile-menu-button" class="md:hidden fixed top-4 left-4 z-50 bg-white p-2 rounded-md shadow-lg">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-white shadow-md hidden md:block fixed md:relative h-full z-40">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-blue-600">Eazeily</h1>
            </div>
            <nav class="mt-6">
                <a href="/dashboard" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-blue-50 hover:text-blue-600">
                    📊 Dashboard
                </a>
                <a href="/onboarding" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-blue-50 hover:text-blue-600">
                    🎨 Brand Setup
                </a>
                <a href="/setup/voice" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-blue-50 hover:text-blue-600">
                    🎤 Voice Setup
                </a>
                <a href="/settings" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-blue-50 hover:text-blue-600">
                    ⚙️ Settings
                </a>
                <hr class="my-4 mx-4 border-gray-200">
                <a href="/auth/logout" onclick="handleLogout(event)" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-red-50 hover:text-red-600 text-gray-700">
                    🚪 Logout
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <div class="container mx-auto">
                {% block content %}
                <div class="bg-white p-8 rounded-lg shadow-md">
                    <h2 class="text-xl font-semibold mb-4">Welcome to Eazeily</h2>
                    <p class="text-gray-600">{{ content if content else "Content goes here..." }}</p>
                </div>
                {% endblock %}
            </div>
        </main>
    </div>

    <script>
        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const sidebar = document.getElementById('sidebar');
        
        if (mobileMenuButton) {
            mobileMenuButton.addEventListener('click', function() {
                sidebar.classList.toggle('hidden');
            });
        }

        // Handle logout
        async function handleLogout(event) {
            event.preventDefault();
            try {
                const response = await fetch('/auth/logout');
                if (response.ok) {
                    window.location.href = '/auth/login';
                } else {
                    alert('Logout failed. Please try again.');
                }
            } catch (error) {
                console.error('Logout error:', error);
                alert('An error occurred during logout.');
            }
        }
    </script>

</body>
</html>
