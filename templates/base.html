<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eazeily - Gemini Native</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Mobile navigation improvements */
        @media (max-width: 768px) {
            /* Ensure sidebar stays hidden by default on mobile */
            #sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease-in-out;
            }
            
            #sidebar.show {
                transform: translateX(0);
            }
            
            /* Overlay for closing sidebar */
            #sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 30;
            }
            
            #sidebar-overlay.show {
                display: block;
            }
            
            /* Larger touch targets */
            #mobile-menu-button {
                min-width: 44px;
                min-height: 44px;
            }
            
            nav a {
                padding: 12px 16px;
                min-height: 44px;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="min-h-screen flex">
        <!-- Mobile Menu Toggle Button -->
        <button id="mobile-menu-button" class="md:hidden fixed top-4 left-4 z-50 bg-white p-3 rounded-lg shadow-lg hover:bg-gray-50 transition-colors" aria-label="Toggle menu">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Overlay for mobile -->
        <div id="sidebar-overlay" class="md:hidden"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="w-72 bg-white shadow-md fixed md:relative h-full z-40 overflow-y-auto">
            <div class="p-6 flex items-center justify-between border-b border-gray-200">
                <h1 class="text-2xl font-bold text-blue-600">Eazeily</h1>
                <!-- Close button for mobile -->
                <button id="sidebar-close" class="md:hidden p-2 hover:bg-gray-100 rounded-lg" aria-label="Close menu">
                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <nav class="mt-4 space-y-2 text-sm text-slate-700 pb-8">
                <!-- Main Actions -->
                <div class="px-2 mb-4">
                    <a href="/dashboard" class="flex items-center space-x-3 py-3 px-4 rounded-lg transition duration-150 bg-blue-50 text-blue-600 font-medium hover:bg-blue-100" aria-label="Navigate to content creation dashboard">
                        <span class="text-xl">✨</span><span>Create Content</span>
                    </a>
                </div>

                <!-- Brand Setup -->
                <div class="px-2">
                    <p class="px-2 text-xs uppercase tracking-wide text-slate-500 font-semibold mb-2">Brand Setup</p>
                    <a href="/onboarding" class="flex items-center space-x-3 py-3 px-4 rounded-lg transition duration-150 hover:bg-blue-50 hover:text-blue-600">
                        <span class="text-xl">🎨</span><span>Brand Profile</span>
                    </a>
                    <a href="/setup/voice" class="flex items-center space-x-3 py-3 px-4 rounded-lg transition duration-150 hover:bg-blue-50 hover:text-blue-600">
                        <span class="text-xl">🎤</span><span>Voice & Tone</span>
                    </a>
                </div>

                <hr class="mx-4 my-4 border-gray-200">
                
                <!-- Account -->
                <div class="px-2">
                    <a href="/auth/logout" onclick="handleLogout(event)" class="flex items-center space-x-3 py-3 px-4 rounded-lg transition duration-150 hover:bg-red-50 hover:text-red-600 text-gray-700">
                        <span class="text-xl">🚪</span><span>Logout</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 md:p-6 mt-16 md:mt-0">
            <div class="container mx-auto">
                {% block content %}
                <div class="bg-white p-8 rounded-lg shadow-md">
                    <h2 class="text-xl font-semibold mb-4">Welcome to Eazeily</h2>
                    <p class="text-gray-600">{{ content if content else "Content goes here..." }}</p>
                </div>
                {% endblock %}
            </div>
        </main>
    </div>

    <script>
        // Mobile menu toggle with improved UX
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const sidebar = document.getElementById('sidebar');
        const sidebarClose = document.getElementById('sidebar-close');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        
        function openSidebar() {
            sidebar.classList.add('show');
            sidebarOverlay.classList.add('show');
            document.body.style.overflow = 'hidden'; // Prevent scrolling
        }
        
        function closeSidebar() {
            sidebar.classList.remove('show');
            sidebarOverlay.classList.remove('show');
            document.body.style.overflow = ''; // Restore scrolling
        }
        
        if (mobileMenuButton) {
            mobileMenuButton.addEventListener('click', openSidebar);
        }
        
        if (sidebarClose) {
            sidebarClose.addEventListener('click', closeSidebar);
        }
        
        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', closeSidebar);
        }
        
        // Close sidebar when clicking a link on mobile
        const navLinks = sidebar.querySelectorAll('a');
        const mediaQuery = window.matchMedia('(max-width: 767px)');
        
        function handleNavClick() {
            if (mediaQuery.matches) {
                closeSidebar();
            }
        }
        
        navLinks.forEach(link => {
            link.addEventListener('click', handleNavClick);
        });

        // Handle logout
        // Note: Logout requires JavaScript. If JS is disabled, the /auth/logout endpoint
        // will return JSON which isn't ideal UX. Consider adding a server-side redirect
        // logout route in the future for better accessibility.
        async function handleLogout(event) {
            event.preventDefault();
            try {
                const response = await fetch('/auth/logout');
                if (response.ok) {
                    window.location.href = '/auth/login';
                } else {
                    alert('Logout failed. Please try again.');
                }
            } catch (error) {
                console.error('Logout error:', error);
                alert('An error occurred during logout.');
            }
        }
    </script>

    {% block scripts %}
    <!-- Page-specific scripts can be added here -->
    {% endblock %}

</body>
</html>
