<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team Inbox - Swelly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/swelly-theme.css" />
</head>
<body class="bg-slate-50 min-h-screen" data-initial-user="{{ initial_user | tojson | forceescape }}">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <img src="/static/logo.svg" alt="Swelly" class="h-8" />
        <span class="font-semibold text-slate-800 hidden sm:inline">Swelly Team Inbox</span>
      </a>
      <nav class="flex items-center gap-4 text-sm text-slate-600">
        <a href="/generate" class="hover:text-brand">Generate</a>
        <a href="/inbox" class="text-brand font-semibold">Inbox</a>
        <a href="/account" class="hover:text-brand">Account</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10 space-y-6">
    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <p class="text-xs uppercase tracking-[0.25em] text-slate-500">Team Inbox</p>
        <h1 class="text-3xl font-bold text-slate-900 mt-2">Campaign-ready drafts</h1>
        <p class="text-slate-600 mt-1">Filter by campaign, assignee, or status, then jump straight into the draft detail.</p>
      </div>
      <div class="flex gap-3">
        <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-2 rounded-xl text-sm flex items-center gap-2">
          <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
          <span>Live syncing</span>
        </div>
      </div>
    </div>

    <section class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
      <div class="grid gap-3 md:grid-cols-3">
        <label class="flex flex-col gap-1 text-sm text-slate-700">
          <span>Campaign</span>
          <select id="filter-campaign" class="input text-sm">
            <option value="">All campaigns</option>
          </select>
        </label>
        <label class="flex flex-col gap-1 text-sm text-slate-700">
          <span>Assignee</span>
          <select id="filter-assignee" class="input text-sm">
            <option value="">All teammates</option>
          </select>
        </label>
        <label class="flex flex-col gap-1 text-sm text-slate-700">
          <span>Status</span>
          <select id="filter-status" class="input text-sm">
            <option value="">Any status</option>
            <option value="draft">Draft</option>
            <option value="in_review">In Review</option>
            <option value="approved">Approved</option>
            <option value="scheduled">Scheduled</option>
          </select>
        </label>
      </div>
    </section>

    <section id="inbox-list" class="space-y-4"></section>
  </main>

  <script>window.INBOX_VIEW = { fetchUrl: '/api/team/drafts' };</script>
  <script src="/static/inbox.js"></script>
</body>
</html>
